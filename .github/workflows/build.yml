name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release with the APK
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  MODEL_HOST: https://huggingface.co/MostLime/keylime-m1-preview/resolve/main
  MODEL_HOST_M2: https://huggingface.co/MostLime/keylime-m2-preview/resolve/main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # step graph for the ORT parity tests (engine/OrtParityTest); the tests skip if the host is unreachable
      - name: Cache test model
        uses: actions/cache@v5
        with:
          path: models
          key: test-model-v2-${{ hashFiles('app/src/main/assets/manifest.json') }}
      - name: Fetch test model
        continue-on-error: true
        run: |
          mkdir -p models
          [ -s models/lm_block4.step.int8.ort ] || curl -fsSL --retry 3 -o models/lm_block4.step.int8.ort "$MODEL_HOST/lm_block4.step.int8.ort" || rm -f models/lm_block4.step.int8.ort
          # fallback: the Nest mirror of the same file
          [ -s models/lm_block4.step.int8.ort ] || curl -fsSL --retry 3 -o models/lm_block4.step.int8.ort "https://autocorrect.mostlime.hackclub.app/autocorrect-android/lm_block4.step.int8.ort" || rm -f models/lm_block4.step.int8.ort
          # m2s int4 graph for engine/MemoryTest (chunked scoring parity + peak memory)
          [ -s models/m2s.step.int4m.ort ] || curl -fsSL --retry 3 -o models/m2s.step.int4m.ort "$MODEL_HOST_M2/m2s.step.int4m.ort" || rm -f models/m2s.step.int4m.ort
          ls -la models

      - name: Unit tests (engine parity + app)
        run: AC_MODEL_DIR="$PWD/models" ./gradlew --stacktrace :engine:test :app:testDebugUnitTest

      - name: Release keystore
        if: github.event_name != 'pull_request'
        env:
          KS_B64: ${{ secrets.AC_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.AC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AC_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.AC_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "AC_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "AC_KEYSTORE_PASSWORD=$KS_PASS"
            echo "AC_KEY_ALIAS=$KEY_ALIAS"
            echo "AC_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: ./gradlew --stacktrace :app:assembleRelease

      - name: Name and verify APK
        id: apk
        run: |
          V="0.1.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "autocorrect-$V.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "autocorrect-$V.apk" | grep -E "Signer #1 certificate (DN|SHA-256)" || true
          ls -la "autocorrect-$V.apk"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "file=autocorrect-$V.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: autocorrect-${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.file }}

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) TAG="v${{ steps.apk.outputs.version }}" ;; esac
          gh release create "$TAG" "${{ steps.apk.outputs.file }}" --target "$GITHUB_SHA" --title "Keylime $TAG" \
            --notes "Signed APK built from ${GITHUB_SHA::7}. Install over any earlier build (same signing key)." --latest

  smoke:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: autocorrect-*
          merge-multiple: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          # instrumented tests (real EditText / ImageDecoder) first; they uninstall their debug build afterwards.
          # The release APK is arm64-only, so the smoke test installs the debug build (arm64 + x86_64) instead.
          script: |
            ./gradlew --stacktrace :app:connectedDebugAndroidTest || echo "INSTRUMENTED TESTS FAILED" | tee smoke-instrumented-failed.txt
            mkdir -p smoke && cp -r app/build/reports/androidTests smoke/ 2>/dev/null || true
            ./gradlew --stacktrace :app:assembleDebug
            .github/scripts/smoke.sh app/build/outputs/apk/debug/app-debug.apk
            [ ! -f smoke-instrumented-failed.txt ]
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-${{ github.run_number }}
          path: smoke/

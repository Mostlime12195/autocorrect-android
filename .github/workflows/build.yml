name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub Release with the APK
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  MODEL_HOST: https://smitten.mostlime.hackclub.app/autocorrect-android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # step graph for the ORT parity tests (engine/OrtParityTest); the tests skip if the host is unreachable
      - name: Cache test model
        uses: actions/cache@v5
        with:
          path: models
          key: test-model-${{ hashFiles('app/src/main/assets/manifest.json') }}
      - name: Fetch test model
        continue-on-error: true
        run: |
          mkdir -p models
          [ -s models/lm_block4.step.int8.ort ] || curl -fsSL --retry 3 -o models/lm_block4.step.int8.ort "$MODEL_HOST/lm_block4.step.int8.ort" || rm -f models/lm_block4.step.int8.ort
          ls -la models

      - name: Unit tests (engine parity + app)
        run: AC_MODEL_DIR="$PWD/models" ./gradlew --stacktrace :engine:test :app:testDebugUnitTest

      - name: Release keystore
        if: github.event_name != 'pull_request'
        env:
          KS_B64: ${{ secrets.AC_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.AC_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AC_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.AC_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "AC_KEYSTORE_PATH=$RUNNER_TEMP/release.jks"
            echo "AC_KEYSTORE_PASSWORD=$KS_PASS"
            echo "AC_KEY_ALIAS=$KEY_ALIAS"
            echo "AC_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: ./gradlew --stacktrace :app:assembleRelease

      - name: Name and verify APK
        id: apk
        run: |
          V="0.1.${GITHUB_RUN_NUMBER}"
          cp app/build/outputs/apk/release/app-release.apk "autocorrect-$V.apk"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "autocorrect-$V.apk" | grep -E "Signer #1 certificate (DN|SHA-256)" || true
          ls -la "autocorrect-$V.apk"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "file=autocorrect-$V.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: autocorrect-${{ steps.apk.outputs.version }}
          path: ${{ steps.apk.outputs.file }}

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) TAG="v${{ steps.apk.outputs.version }}" ;; esac
          gh release create "$TAG" "${{ steps.apk.outputs.file }}" --target "$GITHUB_SHA" --title "Autocorrect $TAG" \
            --notes "Signed APK built from ${GITHUB_SHA::7}. Install over any earlier build (same signing key)." --latest
